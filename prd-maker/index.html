<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <title>PRD 메이커</title>
  <style>
    :root{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202535;background:#f7f8fc;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}
    .shell{max-width:1380px;margin:auto;padding:34px 28px 24px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}
    .eyebrow{font-size:12px;font-weight:750;color:#5367cc;letter-spacing:.08em;text-transform:uppercase}.top h1{font-size:30px;letter-spacing:-.04em;margin:5px 0 6px}.sub{margin:0;color:#697184;font-size:14px}
    .top-actions{display:flex;gap:9px}.btn{border:1px solid #d9ddeb;background:white;color:#30364a;border-radius:9px;padding:10px 14px;font-weight:650;font-size:13px}.btn:hover{border-color:#8290df}.btn.primary{background:#455bd2;border-color:#455bd2;color:#fff}.btn.primary:hover{background:#3549bc}.btn.danger{color:#8a5360}
    .layout{display:grid;grid-template-columns:minmax(320px,.9fr) minmax(420px,1.1fr);gap:20px;align-items:start}.card{background:#fff;border:1px solid #e5e8f0;border-radius:15px;box-shadow:0 5px 22px #26345a08;overflow:hidden}.card-head{padding:18px 20px;border-bottom:1px solid #edf0f5;display:flex;justify-content:space-between;align-items:center}.card-head h2{margin:0;font-size:16px}.card-head span{font-size:12px;color:#81899a}.form{padding:19px 20px 22px;display:grid;gap:15px}.field label{display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:7px}.field small{font-weight:450;color:#9299a8}.field input,.field textarea{display:block;width:100%;border:1px solid #dfe3ec;border-radius:8px;padding:10px 11px;color:#252b3b;background:#fff;outline:none;line-height:1.55}.field textarea{resize:vertical;min-height:72px}.field textarea.tall{min-height:104px}.field input:focus,.field textarea:focus{border-color:#7584e1;box-shadow:0 0 0 3px #596dde16}.hint{font-size:12px;color:#7a8292;margin:6px 0 0}.notice{display:none;background:#fff7de;border:1px solid #f1dfa2;color:#785a13;padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.5}.notice.show{display:block}.warning{display:none;background:#fff0ed;border:1px solid #f3c4ba;color:#9b4436;padding:10px 12px;border-radius:8px;font-size:12px}.warning.show{display:block}
    .preview{position:sticky;top:16px}.tabs{display:flex;gap:5px}.tab{border:0;background:transparent;padding:8px 10px;color:#7a8191;border-radius:7px;font-weight:650;font-size:13px}.tab.active{background:#eef0ff;color:#394dbd}.preview-tools{padding:11px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #edf0f5}.actions{display:flex;gap:7px}.actions .btn{padding:8px 10px;font-size:12px}.status{font-size:12px;color:#7c8494;min-height:16px}.output{padding:20px 22px;min-height:570px;max-height:calc(100vh - 200px);overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.72 ui-monospace,SFMono-Regular,Consolas,monospace;color:#3d4558}.footer{display:flex;justify-content:space-between;gap:12px;padding:16px 2px;color:#8790a0;font-size:12px}.footer a{color:#5969c5;text-decoration:none}.footer a:hover{text-decoration:underline}.sample-tag{color:#9a6c19;font-size:11px;font-weight:700;margin-left:7px}
    @media(max-width:850px){.layout{grid-template-columns:1fr}.preview{position:static}.output{min-height:420px;max-height:none}}
    @media(max-width:480px){.shell{padding:22px 14px 18px}.top{align-items:flex-start;flex-direction:column;margin-bottom:18px}.top h1{font-size:26px}.top-actions{width:100%}.top-actions .btn{flex:1}.layout{gap:14px}.card-head{padding:15px}.form{padding:16px 14px 18px}.preview-tools{padding:10px}.tabs{gap:0}.tab{padding:8px 7px;font-size:12px}.actions{gap:5px}.actions .btn{padding:8px 7px;font-size:11px}.output{padding:16px 14px;font-size:12px;min-height:360px}.footer{flex-direction:column}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div><div class="eyebrow">작은 기획 도구</div><h1>PRD 메이커</h1><p class="sub">아이디어를 정리하고 바로 쓸 수 있는 기획 문서와 프롬프트를 만드세요.</p></div>
      <div class="top-actions"><button class="btn" id="exampleBtn" type="button">예시 채우기</button><button class="btn danger" id="clearBtn" type="button">지우기</button></div>
    </header>
    <div class="layout">
      <section class="card" aria-labelledby="formTitle">
        <div class="card-head"><h2 id="formTitle">서비스 정보</h2><span>입력 내용은 이 기기에만 저장됩니다</span></div>
        <form class="form" id="prdForm" autocomplete="off">
          <div class="field"><label for="idea">서비스 아이디어</label><input id="idea" data-label="서비스 아이디어" placeholder="어떤 서비스를 만들고 싶나요?"></div>
          <div class="field"><label for="problem">해결할 문제</label><textarea id="problem" data-label="해결할 문제" placeholder="사용자가 겪는 불편을 적어 주세요"></textarea></div>
          <div class="field"><label for="audience">타깃 사용자</label><input id="audience" data-label="타깃 사용자" placeholder="누구를 위한 서비스인가요?"></div>
          <div class="field"><label for="value">핵심 가치</label><textarea id="value" data-label="핵심 가치" placeholder="사용자가 얻는 가장 중요한 가치는 무엇인가요?"></textarea></div>
          <div class="field"><label for="features">핵심 기능 <small>줄마다 하나씩</small></label><textarea class="tall" id="features" data-label="핵심 기능" placeholder="예: 일정 선택&#10;예: 예약 확인"></textarea><p class="hint">첫 버전은 기능을 5개 이하로 정리해 보세요.</p><div class="warning" id="featureWarning" role="status">첫 버전은 5개 이하를 권장합니다. 기능을 덜어낼 수 있는지 살펴보세요.</div></div>
          <div class="field"><label for="flow">사용자 흐름</label><textarea id="flow" data-label="사용자 흐름" placeholder="사용자가 처음부터 목표를 이룰 때까지의 순서"></textarea></div>
          <div class="field"><label for="pages">페이지 구조</label><textarea id="pages" data-label="페이지 구조" placeholder="필요한 화면과 각 화면의 역할"></textarea></div>
          <div class="field"><label for="exclude">이번에 안 만들 것</label><textarea id="exclude" data-label="이번에 안 만들 것" placeholder="첫 버전에서 제외할 기능이나 범위"></textarea><div class="notice" id="excludeNotice" role="status">이번에 안 만들 것을 적어 두면 첫 버전의 범위가 더 분명해집니다.</div></div>
          <div class="field"><label for="done">완료 조건</label><textarea id="done" data-label="완료 조건" placeholder="무엇을 확인하면 완성이라고 할 수 있나요?"></textarea></div>
        </form>
      </section>
      <section class="card preview" aria-label="생성 결과">
        <div class="card-head"><h2>실시간 미리보기</h2><div class="tabs" role="tablist"><button class="tab active" type="button" role="tab" aria-selected="true" data-tab="prd">PRD 문서</button><button class="tab" type="button" role="tab" aria-selected="false" data-tab="prompt">AI에게 줄 프롬프트</button></div></div>
        <div class="preview-tools"><span class="status" id="status" aria-live="polite"></span><div class="actions"><button class="btn" id="copyBtn" type="button">복사</button><button class="btn" id="downloadBtn" type="button">.md 내려받기</button></div></div>
        <pre class="output" id="output" role="tabpanel"></pre>
      </section>
    </div>
    <footer class="footer"><span>입력한 내용은 브라우저에 임시 저장됩니다.</span><a href="https://www.instagram.com/stanleetamaiworklab/?utm_source=tool&amp;utm_campaign=prd-maker" target="_blank" rel="noopener noreferrer">인스타그램 @stanleetamaiworklab</a></footer>
  </main>
  <script>
    (() => {
      'use strict';
      const STORAGE_KEY = 'prd-maker-v1';
      const fields = Array.from(document.querySelectorAll('[data-label]'));
      const output = document.getElementById('output');
      const status = document.getElementById('status');
      const featureWarning = document.getElementById('featureWarning');
      const excludeNotice = document.getElementById('excludeNotice');
      let activeTab = 'prd';
      let exampleMode = false;
      const valueOf = (id) => document.getElementById(id).value.trim();
      const bullets = (value) => value.split(/\r?\n/).map(line => line.trim()).filter(Boolean).map(line => `- ${line}`).join('\n') || '- 아직 입력하지 않았습니다.';
      const section = (heading, value) => `## ${heading}\n\n${value || '아직 입력하지 않았습니다.'}`;
      function makePrd() {
        const features = valueOf('features');
        const featureLines = features.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
        featureWarning.classList.toggle('show', featureLines.length > 5);
        excludeNotice.classList.toggle('show', !valueOf('exclude'));
        return [
          `# ${valueOf('idea') || '서비스 PRD'}`,
          exampleMode ? '> 가상 예시입니다. 실제 서비스 사례가 아닙니다.' : '',
          section('해결할 문제', valueOf('problem')),
          section('타깃 사용자', valueOf('audience')),
          section('핵심 가치', valueOf('value')),
          `## 핵심 기능\n\n${bullets(features)}`,
          section('사용자 흐름', valueOf('flow')),
          section('페이지 구조', valueOf('pages')),
          section('이번에 안 만들 것', valueOf('exclude')),
          section('완료 조건', valueOf('done'))
        ].filter(Boolean).join('\n\n');
      }
      function makePrompt(prd) {
        return `# AI에게 줄 프롬프트\n\n아래 PRD를 바탕으로 첫 버전의 구현 계획을 제안해 주세요.\n\n- 요구사항에 없는 기능을 추가하지 마세요.\n- 이번에 안 만들 것은 범위에서 제외하세요.\n- 완료 조건을 확인할 수 있는 구체적인 작업 순서를 제시하세요.\n- 정보가 부족하면 임의로 정하지 말고 질문으로 남겨 주세요.\n\n${prd}`;
      }
      function render() {
        const prd = makePrd();
        output.textContent = activeTab === 'prd' ? prd : makePrompt(prd);
        status.textContent = exampleMode ? '가상 예시' : '';
      }
      function save() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(Object.fromEntries(fields.map(field => [field.id, field.value])))); } catch (_) { /* 저장이 막혀도 입력과 미리보기는 계속 동작 */ }
      }
      function restore() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
          fields.forEach(field => { if (typeof saved[field.id] === 'string') field.value = saved[field.id]; });
        } catch (_) { /* 저장 데이터가 없거나 읽을 수 없어도 빈 폼으로 시작 */ }
      }
      document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
        activeTab = tab.dataset.tab;
        document.querySelectorAll('.tab').forEach(item => { const selected = item === tab; item.classList.toggle('active', selected); item.setAttribute('aria-selected', String(selected)); });
        render();
      }));
      fields.forEach(field => field.addEventListener('input', () => { exampleMode = false; save(); render(); }));
      document.getElementById('exampleBtn').addEventListener('click', () => {
        const sample = { idea:'동네 필라테스 체험 수업 예약 페이지', problem:'전화나 메시지로 가능한 시간을 물어보고 예약을 확정하는 과정이 번거롭다.', audience:'근처에서 필라테스를 처음 체험하려는 성인', value:'가능한 수업 시간을 한눈에 보고 간단히 체험을 신청한다.', features:'수업 시간 확인\n체험 시간 선택\n신청자 정보 입력\n예약 신청 완료 안내', flow:'페이지 방문 → 수업 시간 확인 → 시간 선택 → 연락처 입력 → 신청 완료 확인', pages:'- 체험 안내: 수업 소개와 시간\n- 예약 신청: 시간 선택과 정보 입력\n- 신청 완료: 접수 안내', exclude:'온라인 결제, 회원 관리, 자동 알림 발송', done:'휴대폰에서 체험 시간을 선택해 신청할 수 있고 완료 안내가 표시된다.' };
        fields.forEach(field => { field.value = sample[field.id] || ''; });
        exampleMode = true; save(); render();
      });
      document.getElementById('clearBtn').addEventListener('click', () => {
        fields.forEach(field => { field.value = ''; }); exampleMode = false;
        try { localStorage.removeItem(STORAGE_KEY); } catch (_) { /* 저장소 사용 불가 시 입력만 비움 */ }
        status.textContent = '입력을 지웠습니다.'; render();
      });
      document.getElementById('copyBtn').addEventListener('click', async () => {
        const text = output.textContent;
        try { await navigator.clipboard.writeText(text); status.textContent = '복사했습니다.'; }
        catch (_) { status.textContent = '복사하지 못했습니다. 내용을 선택해 복사해 주세요.'; }
      });
      document.getElementById('downloadBtn').addEventListener('click', () => {
        const blob = new Blob([output.textContent], { type:'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a'); link.href = url; link.download = activeTab === 'prd' ? 'service-prd.md' : 'ai-prompt.md';
        document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url);
      });
      restore(); render();
    })();
  </script>
</body>
</html>
